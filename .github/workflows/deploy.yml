name: Deploy Tokenwise to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build || npx vite build

      - name: Prepare GitHub Pages Static Dist Folder
        run: |
          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/ || true
          fi

          # Copy public root files if missing
          if [ -f "public/favicon.svg" ]; then
            cp public/favicon.svg dist/ || true
          fi
          if [ -f "public/robots.txt" ]; then
            cp public/robots.txt dist/ || true
          fi

          JS_FILE=$(find dist/assets -name "index-*.js" | head -n 1)
          CSS_FILE=$(find dist/assets -name "index-*.css" | head -n 1)
          JS_NAME=$(basename "$JS_FILE")
          CSS_NAME=$(basename "$CSS_FILE")

          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Tokenwise - AI Token Management</title>
              <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF

          if [ -n "$CSS_NAME" ]; then
            sed -i "s|</head>|<link rel=\"stylesheet\" href=\"./assets/$CSS_NAME\"></head>|" dist/index.html
          fi
          if [ -n "$JS_NAME" ]; then
            sed -i "s|</body>|<script type=\"module\" src=\"./assets/$JS_NAME\"></script></body>|" dist/index.html
          fi

          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
